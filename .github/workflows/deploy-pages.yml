name: deploy-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages is served from the gh-pages branch, where pull request previews live under pr-preview/
permissions:
  contents: write

# Let a deployment in progress finish, but skip any queued between it and the latest push
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://rguillon.github.io/synthride/
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build the game
        run: uv run synthride build --out _site

      - name: Build the documentation
        run: uv run mkdocs build --strict --site-dir _site/docs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
