name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Run checks
        run: make check

  python-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      oldest: ${{ steps.read.outputs.oldest }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read Python versions from tox.ini
        id: read
        shell: python
        run: |
          import configparser, json, os
          tox = configparser.ConfigParser()
          tox.read("tox.ini")
          versions = sorted(
              (line.split(":")[0].strip() for line in tox["gh-actions"]["python"].strip().splitlines()),
              key=lambda v: tuple(map(int, v.split("."))),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"versions={json.dumps(versions)}\n")
              out.write(f"oldest={versions[0]}\n")

  tests-and-type-check:
    needs: python-versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run ty check


      - name: Upload coverage reports to Codecov on the oldest supported Python
        uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == needs.python-versions.outputs.oldest }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Check if documentation can be built
        run: uv run mkdocs build -s

  preview:
    # Only once everything above passed, and not for forks, whose token cannot push
    needs: [quality, tests-and-type-check, check-docs]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: preview-${{ github.ref }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build the game
        run: uv run synthride build --out _site

      - name: Deploy the preview and comment its link on the pull request
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
