[project]
name = "synthride"
version = "0.0.1"
description = "A SkyRoads-inspired synthwave 3D racer written in Python, running in the browser via Pyodide."
authors = [{ name = "Renaud Guillon", email = "renaud.guillon@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
synthride = "synthride.server.server_cli:main"

[project.urls]
Homepage = "https://rguillon.github.io/synthride/"
Repository = "https://github.com/rguillon/synthride"
Documentation = "https://rguillon.github.io/synthride/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "ty>=0.0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "numpy>=2.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthride"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL", "RUF022"]
ignore = [  "COM812",   # cause incompatibility with the formatter
            "ISC001",   # cause incompatibility with the formatter
            "D203",     # conflict with another rule
            "D213",     # conflict with another rule
            "PLR2004",  # Magic values
            ]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "S101",     # Allow assert in tests
              "D100",     # No docstring in tests
              "D101",     # No docstring in tests
              "D102",     # No docstring in tests
              "D103",     # No docstring in tests
              "D105",     # No docstring in tests
              "D107",     # No docstring in tests
              "S311",     # Seeded pseudo-random generators make reproducible tests
              ]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/synthride/levels/*"]

[tool.deptry.per_rule_ignores]
# Provided by the Pyodide runtime in the browser, never installed from PyPI.
DEP001 = ["js", "pyodide"]
